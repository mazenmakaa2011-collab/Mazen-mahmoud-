:root{--gold:#d9b45f;--bg:#090909;--muted:#aaa;--line:#37332a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:Tahoma,Arial,sans-serif}
main{max-width:650px;margin:auto;padding:16px 16px 36px}
.hero{height:340px;border:1.5px solid var(--gold);border-radius:28px;overflow:hidden;position:relative;box-shadow:0 0 25px #d9b45f20;background:#161616}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center 32%;display:block}
.hero:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,#090909dd)}
.intro{text-align:center;padding:24px 8px 26px}
h1{font-size:36px;color:#f0d28b;margin:0 0 7px}
.latin{color:var(--gold);letter-spacing:4px;font-size:17px;font-weight:bold}
.tagline{color:#aaa;font-size:18px;margin:14px 0 0}
.links{display:grid;gap:14px}
.link{display:flex;align-items:center;gap:14px;min-height:88px;padding:13px 15px;text-decoration:none;color:white;background:linear-gradient(110deg,#111,#151515);border:1px solid var(--line);border-radius:25px;transition:.18s}
.link:active,.link:hover{border-color:var(--gold);background:#18150e}
.icon{width:62px;height:62px;flex:0 0 62px;display:grid;place-items:center;border:1px solid #67552f;border-radius:19px;background:#202020;color:var(--gold);font-size:28px;font-weight:bold}
.info{flex:1;text-align:right;min-width:0}
.info strong{display:block;font-size:19px;margin-bottom:5px}
.info small{display:block;color:var(--muted);font-size:14px;direction:ltr;overflow-wrap:anywhere}
.arrow{color:var(--gold);font-size:29px;padding:0 4px}
footer{text-align:center;color:#8b713d;margin-top:25px;font-size:12px;letter-spacing:2px}
@media(min-width:500px){main{padding-top:24px}.hero{height:410px}}
